firedrill: v0
drill: agent/no-secrets-in-agent-config
cases:
    - name: no agent secrets
      expect: PASS
      target:
        local: true
        name: acme/api
      facts:
        agents:
            found:
                - allowed_commands: []
                  denied_commands: []
                  deny_read_paths: []
                  egress: open
                  egress_hosts: []
                  egress_unbounded: false
                  file: .claude/settings.json
                  gitignored: false
                  local_override: false
                  mcp_servers: []
                  scope: repo
                  tool: claude-code
                  unguarded_destructive: []
            inspected: 1
            shared_credentials: []
        secrets:
            found:
                - agent_readable: true
                  env_class: unknown
                  file: scripts/x.sh
                  gitignored: false
                  hash: h
                  in_agent_config: false
                  key_id: ""
                  kind: generic
                  line: 1
            inspected: 5
            shared_prod_staging: []
      inspected:
        agents: 1
        secrets: 5
