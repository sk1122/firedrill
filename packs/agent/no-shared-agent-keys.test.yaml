firedrill: v0
drill: agent/no-shared-agent-keys
cases:
    - name: own keys
      expect: PASS
      target:
        local: true
        name: acme/api
      facts:
        agents:
            found:
                - allowed_commands: []
                  denied_commands: []
                  deny_read_paths: []
                  file: .mcp.json
                  mcp_servers:
                    - command: acme-mcp
                      credentials:
                        - secret:a
                      host: ""
                      host_known: false
                      name: a
                      package: ""
                      package_known: true
                      pinned: true
                      transport: stdio
                      version: ""
                    - command: acme-mcp
                      credentials:
                        - secret:b
                      host: ""
                      host_known: false
                      name: b
                      package: ""
                      package_known: true
                      pinned: true
                      transport: stdio
                      version: ""
                  scope: repo
                  tool: claude-code
                  unguarded_destructive: []
            inspected: 1
            shared_credentials: []
      inspected:
        agents: 1
    - name: shared
      expect: FAIL
      target:
        local: true
        name: acme/api
      facts:
        agents:
            found:
                - allowed_commands: []
                  denied_commands: []
                  deny_read_paths: []
                  file: .mcp.json
                  mcp_servers:
                    - command: acme-mcp
                      credentials:
                        - secret:a
                      host: ""
                      host_known: false
                      name: a
                      package: ""
                      package_known: true
                      pinned: true
                      transport: stdio
                      version: ""
                    - command: acme-mcp
                      credentials:
                        - secret:a
                      host: ""
                      host_known: false
                      name: b
                      package: ""
                      package_known: true
                      pinned: true
                      transport: stdio
                      version: ""
                  scope: repo
                  tool: claude-code
                  unguarded_destructive: []
            inspected: 1
            shared_credentials:
                - secret:a
      inspected:
        agents: 1
    - name: no configs
      expect: N/A
      target:
        local: true
        name: acme/api
      facts:
        agents:
            found: []
            inspected: 0
            shared_credentials: []
