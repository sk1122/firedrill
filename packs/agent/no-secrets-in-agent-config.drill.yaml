firedrill: v0
id: agent/no-secrets-in-agent-config
safeguard: "No secret sits in a coding agent's config files, and local agent settings are gitignored."
severity: critical
for_each: repos
fetch:
  secrets: { fact: files.secrets }
  agents:  { fact: files.agent_configs }
pass_when:
  - secrets.found.filter(s, s.in_agent_config).size() == 0
  - agents.found.filter(a, a.local_override && !a.gitignored).size() == 0
fix: "Rotate each secret listed, remove it from the agent file, add .claude/settings.local.json and other local agent files to .gitignore, and remove them from git history."
maps_to: [SOC2:CC6.1]
