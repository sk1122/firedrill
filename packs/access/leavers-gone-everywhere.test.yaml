firedrill: v0
drill: access/leavers-gone-everywhere
cases:
    - name: leaver still active in Google Workspace
      expect: FAIL
      facts:
        leavers:
            - email: dee@acme.example
              id: person:dee
              leave_date: "2026-10-01"
        people:
            bypass_known: true
            found:
                - email: dee@acme.example
                  external: false
                  gcp_admin: []
                  gcp_destructive: []
                  gcp_power_known: true
                  gcp_roles: []
                  github_admin_repos: []
                  github_bypass: []
                  github_org_role: none
                  github_present: false
                  github_repos: []
                  google_active: true
                  google_admin: false
                  google_present: true
                  id: person:dee
                  leaver: true
                  prod_destructive: []
                  systems:
                    - google
            group_members_known: true
            production_basis: ""
            systems_read:
                - google
            unlinked:
                bypass_repos: []
                gcp: 0
                github: 0
                total: 0
    - name: leaver suspended in Google but still holds a GCP role
      expect: FAIL
      facts:
        leavers:
            - email: dee@acme.example
              id: person:dee
              leave_date: "2026-10-01"
        people:
            bypass_known: true
            found:
                - email: dee@acme.example
                  external: false
                  gcp_admin: []
                  gcp_destructive:
                    - acme-prod
                  gcp_power_known: true
                  gcp_roles:
                    - acme-prod:roles/storage.objectAdmin
                  github_admin_repos: []
                  github_bypass: []
                  github_org_role: none
                  github_present: false
                  github_repos: []
                  google_active: false
                  google_admin: false
                  google_present: true
                  id: person:dee
                  leaver: true
                  prod_destructive:
                    - acme-prod
                  systems:
                    - gcp
                    - google
            group_members_known: true
            production_basis: ""
            systems_read:
                - google
                - gcp
            unlinked:
                bypass_repos: []
                gcp: 0
                github: 0
                total: 0
