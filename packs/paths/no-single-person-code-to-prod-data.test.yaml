firedrill: v0
drill: paths/no-single-person-code-to-prod-data
cases:
    - name: one person can bypass review and delete production data
      expect: FAIL
      target:
        name: acme/api
        plan: team
        private: true
        protection_available: true
      facts:
        env:
            admin_bypass: false
            exists: true
            prevent_self_review: true
            protected_branches_only: true
            required_reviewers:
                - '@a'
            reviewers_available: false
        people:
            bypass_known: true
            found:
                - email: ana@acme.example
                  external: false
                  gcp_admin:
                    - acme-prod
                  gcp_destructive:
                    - acme-prod
                  gcp_power_known: true
                  gcp_roles:
                    - acme-prod:roles/owner
                  github_admin_repos: []
                  github_bypass:
                    - acme/api
                  github_org_role: admin
                  github_present: true
                  github_repos: []
                  google_active: false
                  google_admin: false
                  google_present: false
                  id: person:ana
                  leaver: false
                  prod_destructive:
                    - acme-prod
                  systems:
                    - gcp
                    - github
            group_members_known: true
            production_basis: ""
            systems_read:
                - gcp
                - github
            unlinked:
                bypass_repos: []
                gcp: 0
                github: 0
                total: 0
        projects:
            - member_domains: []
              name: acme-prod
              number: "1"
        rules:
            bypass: allowed
            bypass_actors_known: true
            bypass_source: api
            code_owner_review: false
            deletion_allowed: false
            dismiss_stale: true
            force_push_allowed: false
            required_approvals: 1
