firedrill: v0
drill: change/prod-deploy-gated
cases:
    - name: pass
      expect: PASS
      target:
        name: acme/api
        plan: team
        private: true
        production: true
        protection_available: true
      facts:
        env:
            admin_bypass: false
            exists: true
            names:
                - production
            prevent_self_review: false
            protected_branches_only: true
            required_reviewers: []
            reviewers_available: false
    - name: any branch
      expect: FAIL
      target:
        name: acme/api
        plan: team
        private: true
        production: true
        protection_available: true
      facts:
        env:
            admin_bypass: false
            exists: true
            names:
                - production
            prevent_self_review: false
            protected_branches_only: false
            required_reviewers: []
            reviewers_available: false
    - name: enterprise without reviewer
      expect: FAIL
      target:
        name: acme/api
        plan: enterprise
        private: true
        production: true
        protection_available: true
      facts:
        env:
            admin_bypass: false
            exists: true
            names:
                - production
            prevent_self_review: false
            protected_branches_only: true
            required_reviewers: []
            reviewers_available: true
    - name: no env
      expect: N/A
      target:
        name: acme/api
        plan: team
        private: true
        production: false
        protection_available: true
      facts:
        env:
            admin_bypass: false
            exists: false
            names: []
            prevent_self_review: false
            protected_branches_only: false
            required_reviewers: []
            reviewers_available: false
    - name: environment named Prod
      expect: PASS
      target:
        name: acme/api
        plan: team
        private: true
        production: true
        protection_available: true
      facts:
        env:
            admin_bypass: false
            exists: true
            names:
                - Prod
            prevent_self_review: false
            protected_branches_only: true
            required_reviewers: []
            reviewers_available: false
    - name: marked production with no environment
      expect: FAIL
      target:
        name: acme/api
        plan: team
        private: true
        production: true
        protection_available: true
      facts:
        env:
            admin_bypass: false
            exists: false
            names: []
            prevent_self_review: false
            protected_branches_only: false
            required_reviewers: []
            reviewers_available: false
    - name: the least protected of two production environments
      expect: FAIL
      target:
        name: acme/api
        plan: team
        private: true
        production: true
        protection_available: true
      facts:
        env:
            admin_bypass: false
            exists: true
            names:
                - live
                - production
            prevent_self_review: false
            protected_branches_only: false
            required_reviewers: []
            reviewers_available: false
