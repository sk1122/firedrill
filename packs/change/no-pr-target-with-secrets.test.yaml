firedrill: v0
drill: change/no-pr-target-with-secrets
cases:
    - name: pull_request with secrets
      expect: PASS
      target:
        local: true
        name: acme/api
      facts:
        workflows:
            found:
                - cloud_key_secrets: []
                  file: .github/workflows/a.yml
                  permissions: write
                  pull_request_target_checkout: false
                  secrets:
                    - NPM_TOKEN
                  triggers:
                    - pull_request
                    - push
                  unfrozen_installs: []
                  unpinned_actions: []
                  uses_oidc: false
            inspected: 1
      inspected:
        workflows: 1
    - name: read-only pull_request_target
      expect: PASS
      target:
        local: true
        name: acme/api
      facts:
        workflows:
            found:
                - cloud_key_secrets: []
                  file: .github/workflows/a.yml
                  permissions: read
                  pull_request_target_checkout: false
                  secrets: []
                  triggers:
                    - pull_request_target
                  unfrozen_installs: []
                  unpinned_actions: []
                  uses_oidc: false
            inspected: 1
      inspected:
        workflows: 1
    - name: agent on pull_request_target
      expect: FAIL
      target:
        local: true
        name: acme/api
      facts:
        workflows:
            found:
                - cloud_key_secrets: []
                  file: .github/workflows/a.yml
                  permissions: undeclared
                  pull_request_target_checkout: false
                  secrets:
                    - ANTHROPIC_API_KEY
                  triggers:
                    - issue_comment
                    - pull_request_target
                  unfrozen_installs: []
                  unpinned_actions: []
                  uses_oidc: false
            inspected: 1
      inspected:
        workflows: 1
    - name: write token
      expect: FAIL
      target:
        local: true
        name: acme/api
      facts:
        workflows:
            found:
                - cloud_key_secrets: []
                  file: .github/workflows/a.yml
                  permissions: write
                  pull_request_target_checkout: false
                  secrets: []
                  triggers:
                    - pull_request_target
                  unfrozen_installs: []
                  unpinned_actions: []
                  uses_oidc: false
            inspected: 1
      inspected:
        workflows: 1
    - name: read-only with a secret
      expect: FAIL
      target:
        local: true
        name: acme/api
      facts:
        workflows:
            found:
                - cloud_key_secrets: []
                  file: .github/workflows/a.yml
                  permissions: read
                  pull_request_target_checkout: false
                  secrets:
                    - ANTHROPIC_API_KEY
                  triggers:
                    - pull_request_target
                  unfrozen_installs: []
                  unpinned_actions: []
                  uses_oidc: false
            inspected: 1
      inspected:
        workflows: 1
    - name: inherits secrets
      expect: FAIL
      target:
        local: true
        name: acme/api
      facts:
        workflows:
            found:
                - cloud_key_secrets: []
                  file: .github/workflows/a.yml
                  permissions: read
                  pull_request_target_checkout: false
                  secrets:
                    - inherit
                  triggers:
                    - pull_request_target
                  unfrozen_installs: []
                  unpinned_actions: []
                  uses_oidc: false
            inspected: 1
      inspected:
        workflows: 1
    - name: no workflows
      expect: N/A
      target:
        local: true
        name: acme/api
      facts:
        workflows:
            found: []
            inspected: 0
