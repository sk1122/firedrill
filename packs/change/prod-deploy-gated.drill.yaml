firedrill: v0
id: change/prod-deploy-gated
safeguard: "Production deploys come only from protected branches, with a reviewer wherever the plan offers one."
severity: high
for_each: github.repos
fetch:
  env: { fact: github.environment, args: { name: production } }
applies_when: target.production
na_reason: "the repo is not marked production: it has no GitHub environment named production, prod or live (add other names under github.production_environments) and is not listed under production in .firedrill/config.yaml"
pass_when:
  - env.exists
  - env.protected_branches_only
  - >-
    !env.reviewers_available || (env.required_reviewers.size() >= 1 && !env.admin_bypass)
fix: "Deploy to production through a GitHub environment, limit it to protected branches, and add a required reviewer if the plan offers one. A repo listed under production with no production environment fails, since nothing in GitHub gates its deploys. With several production environments, the least protected one is judged."
maps_to: [SOC2:CC8.1, ISO27001:A.8.32]
