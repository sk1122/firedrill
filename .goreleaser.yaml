version: 2
project_name: firedrill
before:
  hooks:
    - go mod tidy
builds:
  - id: firedrill
    main: ./cmd/firedrill
    binary: firedrill
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
checksum:
  name_template: checksums.txt
sboms:
  - id: gomod
    documents:
      - "{{ .ProjectName }}_{{ .Version }}.sbom.json"
    cmd: cyclonedx-gomod
    args: ["mod", "-licenses", "-json", "-output", "$document", ".."]
    artifacts: any
homebrew_casks:
  - name: firedrill
    repository:
      owner: sk1122
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/sk1122/firedrill
    description: Your rules, drilled weekly, with proof.
    license: Apache-2.0
    # The binaries are not signed with an Apple Developer ID, so macOS would
    # refuse to run a downloaded one. Clear the download quarantine on install.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/firedrill"]
          end
release:
  github:
    owner: sk1122
    name: firedrill
